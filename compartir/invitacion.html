<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Invitación Izzi 24 (imagen para compartir)</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Reenie+Beanie&display=swap" rel="stylesheet">
<style>
  /* Lienzo 1080 × 1920: formato historia / pantalla completa de WhatsApp */
  :root { --negro:#07040c; --papel:#e9e3f0; --tinta:#0b0710; --blanco:#f3eefa; --lila:#c7b2ef; --morado:#7c3aed; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1080px; height: 1920px; overflow: hidden; background: var(--negro); color: var(--blanco); font-family: "Archivo", sans-serif; }
  .lienzo { position: relative; width: 1080px; height: 1920px; overflow: hidden; isolation: isolate; }
  /* La foto cubre todo el lienzo; el velo oscurece abajo para que el texto se lea sobre ella */
  .foto { position: absolute; inset: 0; z-index: -2; }
  .foto img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 45%; }
  .foto::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgb(7 4 12 / .3), rgb(7 4 12 / .05) 28%, rgb(7 4 12 / .35) 55%, rgb(7 4 12 / .82) 78%, rgb(7 4 12 / .92) 100%); }
  .grano { position: absolute; inset: 0; z-index: -1; background: url("../public/assets/grano.png"); opacity: .14; }
  .nube { display: none; }

  .tarjeta {
    position: absolute; left: 70px; right: 70px; top: 90px;
    padding: 52px 52px 44px;
    background: var(--papel) url("../public/assets/grano-claro.png"); background-blend-mode: multiply;
    color: var(--tinta); transform: rotate(-2.5deg);
    box-shadow: 0 40px 70px -30px rgb(0 0 0 / .8);
  }
  .tarjeta::before { content: ""; position: absolute; top: -26px; left: 50%; width: 200px; height: 52px; margin-left: -100px; background: rgb(199 178 239 / .7); transform: rotate(4deg); }
  .tarjeta h1 { font-size: 150px; font-weight: 900; line-height: .9; letter-spacing: .01em; text-transform: uppercase; }
  .tarjeta p { margin-top: 26px; font-size: 40px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }

  .fecha { position: absolute; left: 80px; right: 80px; top: 740px; }
  .fecha .mano { font-family: "Reenie Beanie", cursive; font-size: 96px; line-height: 1; color: var(--lila); transform: rotate(-5deg); transform-origin: left; }
  .fecha .num { font-size: 250px; font-weight: 900; line-height: .85; letter-spacing: .01em; }
  .fecha .hora { position: absolute; right: 0; bottom: 6px; padding: 14px 28px 12px; background: var(--lila); color: var(--tinta); font-size: 56px; font-weight: 900; letter-spacing: .04em; transform: rotate(-4deg); }

  .donde { position: absolute; left: 80px; right: 80px; top: 1220px; }
  .donde .etiqueta { font-family: "Reenie Beanie", cursive; font-size: 84px; line-height: 1; color: var(--lila); transform: rotate(-4deg); transform-origin: left; }
  .donde .calle { margin-top: 10px; font-size: 66px; font-weight: 900; line-height: 1; letter-spacing: .01em; white-space: nowrap; }
  .donde .sector { margin-top: 14px; font-size: 42px; line-height: 1.25; color: rgb(243 238 250 / .8); }

  /* Cierre centrado: firma a mano y, debajo, la confirmación */
  .cierre { position: absolute; left: 80px; right: 80px; top: 1570px; display: grid; justify-items: center; text-align: center; }
  .cierre .firma { font-family: "Reenie Beanie", cursive; font-size: 140px; line-height: .9; color: var(--blanco); transform: rotate(-4deg); }
  .cierre .firma span { color: var(--lila); }
  .cierre .confirma { margin-top: 40px; font-size: 44px; font-weight: 900; letter-spacing: .02em; text-transform: uppercase; color: var(--lila); }
</style>
</head>
<body>
  <div class="lienzo">
    <div class="foto"><img src="../public/assets/izzi.jpg" alt=""></div>
    <div class="grano"></div>

    <div class="tarjeta">
      <h1>Estás<br>invitado</h1>
      <p>A mi cumple 24</p>
    </div>

    <div class="fecha">
      <p class="mano">lunes</p>
      <p class="num">07.12</p>
      <p class="hora">19:00 HRS</p>
    </div>

    <div class="donde">
      <p class="etiqueta">Dónde</p>
      <p class="calle">Pasaje La Cordillera S/N</p>
      <p class="sector">El Rincón, La Punta (Mostazal)</p>
    </div>

    <div class="cierre">
      <p class="firma">te espero <span>—izzi</span></p>
      <p class="confirma">Confirma tu asistencia</p>
    </div>
  </div>
</body>
</html>
